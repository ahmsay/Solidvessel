plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'com.google.cloud.tools.jib'
    id 'io.freefair.lombok'
    id 'jacoco'
    id 'org.springframework.cloud.contract'
}

base {
    archivesName = 'payment-infra'
}

dependencies {
    implementation project(':shared:infra')
    implementation project(':payment:domain')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.security:spring-security-test'
    implementation libs.mapstruct
    annotationProcessor libs.mapstruct.processor
    annotationProcessor libs.mapstruct.lombok.binding
    implementation libs.postgres
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation libs.circuit.breaker
    testImplementation libs.junit
    testRuntimeOnly libs.junit.platform.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.testcontainers.postgres
    testImplementation libs.spring.cloud.contract.verifier
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${libs.versions.springCloudBom.get()}"
    }
}

jib {
    from {
        image = "public.ecr.aws/s9i7g5t1/solidvessel/java/eclipse-temurin:21.0.1_12-jre-jammy"
        platforms {
            platform {
                os = "linux"
                architecture = "amd64"
            }
            platform {
                os = "linux"
                architecture = "arm64"
            }
        }
    }
    to {
        image = "public.ecr.aws/s9i7g5t1/solidvessel/payment:latest"
    }
}

contracts {
    contractsDslDir = file("src/test/resources/contracts")
    packageWithBaseClasses = 'com.solidvessel.payment.adapter.in'
    baseClassMappings {
        baseClassMapping("payment", "com.solidvessel.payment.adapter.in.payment.rest.PaymentProducerContractTest")
    }
}

contractTest {
    useJUnitPlatform()
}
