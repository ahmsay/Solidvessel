plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'com.google.cloud.tools.jib'
    id 'io.freefair.lombok'
    id 'jacoco'
}

base {
    archivesName = 'account-infra'
}

dependencies {
    implementation project(':shared:infra')
    implementation project(':account:domain')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.security:spring-security-test'
    implementation libs.mapstruct
    annotationProcessor libs.mapstruct.processor
    annotationProcessor libs.mapstruct.lombok.binding
    implementation libs.postgres
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation libs.feign
    implementation libs.circuit.breaker
    testImplementation libs.junit
    testRuntimeOnly libs.junit.platform.engine
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.testcontainers.postgres
    testImplementation libs.spring.cloud.contract.stub.runner
    testImplementation project(path: ':order:infra', configuration: 'contractStubs')
    testImplementation project(path: ':payment:infra', configuration: 'contractStubs')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${libs.versions.springCloudBom.get()}"
    }
}

jib {
    from {
        image = "public.ecr.aws/s9i7g5t1/solidvessel/java/eclipse-temurin:21.0.1_12-jre-jammy"
        platforms {
            platform {
                os = "linux"
                architecture = "amd64"
            }
            platform {
                os = "linux"
                architecture = "arm64"
            }
        }
    }
    to {
        image = "public.ecr.aws/s9i7g5t1/solidvessel/account:${providers.gradleProperty('imageTag').getOrElse('1.0.0')}"
    }
}
